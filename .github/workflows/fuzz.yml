name: Linux FuzzTest (ASan)

on:
  pull_request:
    paths: ['include/**', 'fuzz/**', 'CMakeLists.txt', 'cmake/**', '.github/workflows/fuzz.yml']
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm ninja-build python3 ripgrep
      - name: Configure standalone suite
        run: >-
          cmake -S fuzz -B build/fuzz -G Ninja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCBOR_FUZZ_COVERAGE=ON
      - name: Build
        run: cmake --build build/fuzz --target cbor_fuzz --parallel 2
      - name: Property and vocabulary smoke tests
        run: ctest --test-dir build/fuzz --output-on-failure
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-v3-${{ github.run_id }}
          restore-keys: fuzz-corpus-v3-
      - name: Coverage-guided ASan campaign
        run: |
          seconds=10
          if [[ '${{ github.event_name }}' != pull_request ]]; then seconds=60; fi
          python3 fuzz/run_campaign.py build/fuzz/cbor_fuzz --seconds "$seconds" --jobs 2 \
            --corpus build/fuzz-corpus --output build/fuzz-evidence
      - name: Source coverage
        if: always()
        run: bash fuzz/coverage.sh build/fuzz/cbor_fuzz build/fuzz-evidence
      - name: Upload evidence and corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-fuzz-asan
          path: |
            build/fuzz-evidence
            build/fuzz-corpus
            build/fuzz/CMakeCache.txt
            build/fuzz/compile_commands.json
