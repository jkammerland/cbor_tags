name: Linux Centipede (ASan)

on:
  pull_request:
    paths: ['include/**', 'fuzz/**', 'CMakeLists.txt', 'cmake/**', '.github/workflows/fuzz.yml']
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm python3 ripgrep
          go install github.com/bazelbuild/bazelisk@v1.28.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Property and vocabulary smoke tests
        working-directory: fuzz
        run: |
          bazelisk test --config=coverage --jobs=2 //:cbor_fuzz
          python3 test_tools.py
      - name: Record build actions
        working-directory: fuzz
        run: |
          mkdir -p ../build/fuzz-build
          bazelisk aquery --config=coverage --output=text \
            'mnemonic("Cpp.*", deps(//:cbor_fuzz))' > ../build/fuzz-build/actions.txt
          bazelisk mod graph > ../build/fuzz-build/modules.txt
      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: build/fuzz-corpus
          key: fuzz-corpus-v2-${{ github.run_id }}
          restore-keys: fuzz-corpus-v2-
      - name: Coverage-guided ASan campaign
        run: |
          seconds=10
          if [[ '${{ github.event_name }}' != pull_request ]]; then seconds=60; fi
          python3 fuzz/run_campaign.py fuzz/bazel-bin/cbor_fuzz --seconds "$seconds" --jobs 2 \
            --corpus build/fuzz-corpus --output build/fuzz-evidence
      - name: Source coverage
        if: always()
        run: bash fuzz/coverage.sh fuzz/bazel-bin/cbor_fuzz build/fuzz-evidence
      - name: Upload evidence and corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-fuzz-asan
          path: |
            build/fuzz-evidence
            build/fuzz-corpus
            build/fuzz-build
