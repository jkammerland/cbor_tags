name: Container interoperability

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  boost:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    strategy:
      matrix:
        standard: [20, 26]
    steps:
      - name: Install compiler and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates cmake git ninja-build g++-16 curl bzip2
      - uses: actions/checkout@v6.0.2
      - name: Fetch pinned Boost headers
        run: |
          curl -fL --retry 2 https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2 -o /tmp/boost.tar.bz2
          echo '5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c  /tmp/boost.tar.bz2' | sha256sum -c -
          tar -xjf /tmp/boost.tar.bz2 -C /tmp boost_1_92_0/boost
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-16 \
            -DCMAKE_CXX_COMPILER=g++-16 \
            -DCMAKE_CXX_STANDARD=${{ matrix.standard }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCBOR_TAGS_BUILD_TESTS=ON \
            -DCBOR_TAGS_TEST_BOOST_ROOT=/tmp/boost_1_92_0 \
            -DCBOR_TAGS_TEST_REQUIRE_RECENT_BOOST=ON
      - name: Build and test
        run: |
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure --parallel 1
