name: macOS Tests (AppleClang C++20/26)

on:
  push:
    branches: [ master, integration ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    name: ${{ matrix.config.name }} C++${{ matrix.cxx_standard }}
    runs-on: ${{ matrix.config.runner }}
    strategy:
      fail-fast: false
      matrix:
        cxx_standard: [20, 26]
        config:
          - {
              name: "macOS AppleClang 26",
              runner: "macos-26",
              cc: "clang",
              cxx: "clang++",
              xcode_version: "^26.0.0"
            }
          - {
              name: "macOS AppleClang 16",
              runner: "macos-15",
              cc: "clang",
              cxx: "clang++",
              xcode_version: "^16.2.0"
            }

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: '3.31.5'

    - name: Setup Xcode (macOS)
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: ${{ matrix.config.xcode_version }}

    - name: Configure CMake
      shell: bash
      run: |
        cxx_standard_args=(
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_EXTENSIONS=OFF
        )
        if [[ "${{ matrix.cxx_standard }}" == "26" ]]; then
          # CMake 3.31 does not model AppleClang CXX26 yet; -std=c++2c is AppleClang's C++26-preview mode.
          preview_flags="${RUNNER_TEMP}/cbor-tags-cxx26-preview.cmake"
          printf '%s\n' 'add_compile_options("$<$<COMPILE_LANGUAGE:CXX>:-std=c++2c>")' > "${preview_flags}"
          cxx_standard_args=(
            -DCMAKE_CXX_STANDARD=23
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
            -DCMAKE_CXX_EXTENSIONS=OFF
            -DCMAKE_PROJECT_INCLUDE="${preview_flags}"
          )
        fi
        cmake -B build-cxx${{ matrix.cxx_standard }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCBOR_TAGS_BUILD_TESTS=ON \
          "${cxx_standard_args[@]}" \
          -DCMAKE_C_COMPILER=${{ matrix.config.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }}

    - name: Build
      shell: bash
      run: cmake --build build-cxx${{ matrix.cxx_standard }} --config Release --parallel

    - name: Test
      shell: bash
      run: ctest --test-dir build-cxx${{ matrix.cxx_standard }} -C Release --output-on-failure

  std-expected-cxx23:
    name: macOS AppleClang C++23 std::expected return tests
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: '3.31.5'

    - name: Setup Xcode (macOS)
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: '^26.0.0'

    - name: Configure CMake with std::expected
      shell: bash
      run: |
        cmake -B build-std-expected-cxx23 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCBOR_TAGS_BUILD_TESTS=ON \
          -DCBOR_TAGS_USE_STD_EXPECTED=ON \
          -DCMAKE_CXX_STANDARD=23 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DCMAKE_CXX_EXTENSIONS=OFF \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++

    - name: Build
      shell: bash
      run: cmake --build build-std-expected-cxx23 --config Release --parallel

    - name: Test
      shell: bash
      run: ctest --test-dir build-std-expected-cxx23 -C Release --output-on-failure

  optional-backends:
    name: ${{ matrix.config.name }} C++${{ matrix.cxx_standard }} ${{ matrix.backend.name }}
    runs-on: ${{ matrix.config.runner }}
    strategy:
      fail-fast: false
      matrix:
        cxx_standard: [20, 26]
        config:
          - {
              name: "macOS AppleClang 26",
              runner: "macos-26",
              cc: "clang",
              cxx: "clang++",
              xcode_version: "^26.0.0"
            }
          - {
              name: "macOS AppleClang 16",
              runner: "macos-15",
              cc: "clang",
              cxx: "clang++",
              xcode_version: "^16.2.0"
            }
        backend:
          - {
              name: "Boost.PFR names",
              id: "boost-pfr-names",
              option: "CBOR_TAGS_USE_BOOST_PFR_NAMES",
              feature: "boost-pfr-names"
            }
          - {
              name: "magic_enum names",
              id: "magic-enum-names",
              option: "CBOR_TAGS_USE_MAGIC_ENUM_NAMES",
              feature: "magic-enum-names"
            }

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: '3.31.5'

    - name: Setup Xcode (macOS)
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: ${{ matrix.config.xcode_version }}

    - name: Bootstrap vcpkg
      uses: ./.github/actions/bootstrap-vcpkg

    - name: Configure CMake with ${{ matrix.backend.name }}
      shell: bash
      run: |
        build_dir="build-${{ matrix.backend.id }}-cxx${{ matrix.cxx_standard }}"
        cxx_standard_args=(
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_EXTENSIONS=OFF
        )
        if [[ "${{ matrix.cxx_standard }}" == "26" ]]; then
          # CMake 3.31 does not model AppleClang CXX26 yet; -std=c++2c is AppleClang's C++26-preview mode.
          preview_flags="${RUNNER_TEMP}/cbor-tags-cxx26-preview.cmake"
          printf '%s\n' 'add_compile_options("$<$<COMPILE_LANGUAGE:CXX>:-std=c++2c>")' > "${preview_flags}"
          cxx_standard_args=(
            -DCMAKE_CXX_STANDARD=23
            -DCMAKE_CXX_STANDARD_REQUIRED=ON
            -DCMAKE_CXX_EXTENSIONS=OFF
            -DCMAKE_PROJECT_INCLUDE="${preview_flags}"
          )
        fi
        cmake -B "${build_dir}" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCBOR_TAGS_BUILD_TESTS=ON \
          -D${{ matrix.backend.option }}=ON \
          "${cxx_standard_args[@]}" \
          -DCMAKE_C_COMPILER=${{ matrix.config.cc }} \
          -DCMAKE_CXX_COMPILER=${{ matrix.config.cxx }} \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_MANIFEST_FEATURES=${{ matrix.backend.feature }}

    - name: Build
      shell: bash
      run: cmake --build build-${{ matrix.backend.id }}-cxx${{ matrix.cxx_standard }} --config Release --parallel

    - name: Test
      shell: bash
      run: ctest --test-dir build-${{ matrix.backend.id }}-cxx${{ matrix.cxx_standard }} -C Release --output-on-failure

  cwt-openssl:
    name: macOS OpenSSL ${{ matrix.runner }} C++${{ matrix.cxx_standard }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
        cxx_standard: [20, 23]
    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: '3.31.5'

    - name: Bootstrap vcpkg
      uses: ./.github/actions/bootstrap-vcpkg

    - name: Select native OpenSSL triplet
      shell: bash
      run: |
        case "$(uname -m)" in
          arm64) triplet=arm64-osx ;;
          x86_64) triplet=x64-osx ;;
          *) echo "Unsupported macOS architecture" >&2; exit 1 ;;
        esac
        echo "CBOR_TAGS_OPENSSL_TRIPLET=${triplet}" >> "${GITHUB_ENV}"

    - name: Configure OpenSSL backend
      shell: bash
      run: |
        cmake -S . -B build-openssl \
          -DCMAKE_BUILD_TYPE=Release \
          -DCBOR_TAGS_BUILD_TESTS=ON \
          -DCBOR_TAGS_INSTALL=ON \
          -DCBOR_TAGS_ENABLE_CWT_OPENSSL=ON \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET="${CBOR_TAGS_OPENSSL_TRIPLET}" \
          -DVCPKG_MANIFEST_FEATURES=cwt-openssl \
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }} \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON \
          -DCMAKE_CXX_EXTENSIONS=OFF \
          -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/cbor-tags-openssl"

    - name: Build and test OpenSSL backend
      shell: bash
      run: |
        cmake --build build-openssl --config Release --parallel 2
        ctest --test-dir build-openssl -C Release --output-on-failure --no-tests=error

    - name: Test installed OpenSSL consumer
      shell: bash
      run: |
        cmake --install build-openssl --config Release
        cmake -S test_package -B build-openssl-consumer \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }} \
          -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/cbor-tags-openssl;${GITHUB_WORKSPACE}/build-openssl/vcpkg_installed/${CBOR_TAGS_OPENSSL_TRIPLET}" \
          -DCBOR_TAGS_TEST_PACKAGE_REQUIRE_CWT_OPENSSL=ON
        cmake --build build-openssl-consumer --config Release --parallel 2
        ./build-openssl-consumer/test_package
