name: Windows Tests (MSVC/Clang-CL C++20/26)

on:
  push:
    branches: [ master, integration ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    name: ${{ matrix.config.name }} C++${{ matrix.cxx_standard }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        cxx_standard: [20, 26]
        config:
          - {
              name: "Windows MSVC",
              toolset: ""
            }
          - {
              name: "Windows Clang-CL",
              toolset: "ClangCL"
            }

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: '4.3.2'
        useCloudCache: false

    - name: Configure CMake (Windows)
      shell: pwsh
      run: |
        $buildDir = "build-cxx${{ matrix.cxx_standard }}"
        $arguments = @(
          "-B", $buildDir,
          "-G", "Visual Studio 18 2026",
          "-A", "x64",
          "-DCBOR_TAGS_BUILD_TESTS=ON"
        )
        if ("${{ matrix.cxx_standard }}" -eq "26") {
          # CMake 4.3 supports the VS 2026 generator but does not model its C++26 preview mode.
          $cxxFlags = "/std:c++latest"
          if ("${{ matrix.config.toolset }}" -eq "ClangCL") {
            $cxxFlags += " -Wno-unused-command-line-argument"
          }
          $arguments += @(
            "-DCMAKE_CXX_STANDARD=23",
            "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
            "-DCMAKE_CXX_EXTENSIONS=OFF",
            "-DCMAKE_CXX_FLAGS_INIT=$cxxFlags"
          )
        } else {
          $arguments += @(
            "-DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}",
            "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
            "-DCMAKE_CXX_EXTENSIONS=OFF"
          )
        }
        if ("${{ matrix.config.toolset }}" -ne "") {
          $arguments += @("-T", "${{ matrix.config.toolset }}")
        }
        cmake @arguments

    - name: Build
      shell: pwsh
      run: cmake --build build-cxx${{ matrix.cxx_standard }} --config Release --parallel

    - name: Test
      shell: pwsh
      run: ctest --test-dir build-cxx${{ matrix.cxx_standard }} -C Release --output-on-failure

  msvc-2022-cxx20:
    name: Windows MSVC 2022 C++20 compatibility
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: '3.31.5'
        useCloudCache: false

    - name: Configure CMake (Visual Studio 2022)
      shell: pwsh
      run: |
        cmake -B build-msvc-2022-cxx20 `
          -G "Visual Studio 17 2022" `
          -A x64 `
          -DCBOR_TAGS_BUILD_TESTS=ON `
          -DCMAKE_CXX_STANDARD=20 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DCMAKE_CXX_EXTENSIONS=OFF

    - name: Build
      shell: pwsh
      run: cmake --build build-msvc-2022-cxx20 --config Release --parallel

    - name: Test
      shell: pwsh
      run: ctest --test-dir build-msvc-2022-cxx20 -C Release --output-on-failure

  std-expected-cxx23:
    name: Windows MSVC C++23 std::expected return tests
    runs-on: windows-2025

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: '4.3.2'
        useCloudCache: false

    - name: Configure CMake with std::expected
      shell: pwsh
      run: |
        cmake -B build-std-expected-cxx23 `
          -G "Visual Studio 18 2026" `
          -A x64 `
          -DCBOR_TAGS_BUILD_TESTS=ON `
          -DCBOR_TAGS_USE_STD_EXPECTED=ON `
          -DCMAKE_CXX_STANDARD=23 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DCMAKE_CXX_EXTENSIONS=OFF

    - name: Build
      shell: pwsh
      run: cmake --build build-std-expected-cxx23 --config Release --parallel

    - name: Test
      shell: pwsh
      run: ctest --test-dir build-std-expected-cxx23 -C Release --output-on-failure

  optional-backends:
    name: ${{ matrix.config.name }} C++${{ matrix.cxx_standard }} ${{ matrix.backend.name }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        cxx_standard: [20, 26]
        config:
          - {
              name: "Windows MSVC",
              toolset: ""
            }
          - {
              name: "Windows Clang-CL",
              toolset: "ClangCL"
            }
        backend:
          - {
              name: "Boost.PFR names",
              id: "boost-pfr-names",
              option: "CBOR_TAGS_USE_BOOST_PFR_NAMES",
              feature: "boost-pfr-names"
            }
          - {
              name: "magic_enum names",
              id: "magic-enum-names",
              option: "CBOR_TAGS_USE_MAGIC_ENUM_NAMES",
              feature: "magic-enum-names"
            }

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: '4.3.2'
        useCloudCache: false

    - name: Bootstrap vcpkg
      uses: ./.github/actions/bootstrap-vcpkg

    - name: Configure CMake with ${{ matrix.backend.name }}
      shell: pwsh
      run: |
        $buildDir = "build-${{ matrix.backend.id }}-cxx${{ matrix.cxx_standard }}"
        $toolchainFile = Join-Path $env:VCPKG_ROOT "scripts\buildsystems\vcpkg.cmake"
        $arguments = @(
          "-B", $buildDir,
          "-G", "Visual Studio 18 2026",
          "-A", "x64",
          "-DCBOR_TAGS_BUILD_TESTS=ON",
          "-D${{ matrix.backend.option }}=ON",
          "-DCMAKE_TOOLCHAIN_FILE=$toolchainFile",
          "-DVCPKG_MANIFEST_FEATURES=${{ matrix.backend.feature }}"
        )
        if ("${{ matrix.cxx_standard }}" -eq "26") {
          # CMake 4.3 supports the VS 2026 generator but does not model its C++26 preview mode.
          $cxxFlags = "/std:c++latest"
          if ("${{ matrix.config.toolset }}" -eq "ClangCL") {
            $cxxFlags += " -Wno-unused-command-line-argument"
          }
          $arguments += @(
            "-DCMAKE_CXX_STANDARD=23",
            "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
            "-DCMAKE_CXX_EXTENSIONS=OFF",
            "-DCMAKE_CXX_FLAGS_INIT=$cxxFlags"
          )
        } else {
          $arguments += @(
            "-DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}",
            "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
            "-DCMAKE_CXX_EXTENSIONS=OFF"
          )
        }
        if ("${{ matrix.config.toolset }}" -ne "") {
          $arguments += @("-T", "${{ matrix.config.toolset }}")
        }
        cmake @arguments

    - name: Build
      shell: pwsh
      run: cmake --build build-${{ matrix.backend.id }}-cxx${{ matrix.cxx_standard }} --config Release --parallel

    - name: Test
      shell: pwsh
      run: ctest --test-dir build-${{ matrix.backend.id }}-cxx${{ matrix.cxx_standard }} -C Release --output-on-failure

  cwt-openssl:
    name: Windows OpenSSL ${{ matrix.compiler }} C++${{ matrix.cxx_standard }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        compiler: [MSVC, ClangCL]
        cxx_standard: [20, 23]
    steps:
    - uses: actions/checkout@v6.0.2

    - name: Setup CMake
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: '3.31.5'
        useCloudCache: false

    - name: Bootstrap vcpkg
      uses: ./.github/actions/bootstrap-vcpkg

    - name: Configure OpenSSL backend
      shell: pwsh
      run: |
        $arguments = @(
          "-S", ".", "-B", "build-openssl",
          "-G", "Visual Studio 17 2022", "-A", "x64",
          "-DCBOR_TAGS_BUILD_TESTS=ON",
          "-DCBOR_TAGS_INSTALL=ON",
          "-DCBOR_TAGS_ENABLE_CWT_OPENSSL=ON",
          "-DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}",
          "-DCMAKE_CXX_STANDARD_REQUIRED=ON",
          "-DCMAKE_CXX_EXTENSIONS=OFF",
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
          "-DVCPKG_TARGET_TRIPLET=x64-windows",
          "-DVCPKG_MANIFEST_FEATURES=cwt-openssl",
          "-DCMAKE_INSTALL_PREFIX=$env:RUNNER_TEMP/cbor-tags-openssl"
        )
        if ("${{ matrix.compiler }}" -eq "ClangCL") {
          $arguments += @("-T", "ClangCL")
        }
        cmake @arguments
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Build and test OpenSSL backend
      shell: pwsh
      run: |
        $env:PATH = "$env:GITHUB_WORKSPACE/build-openssl/vcpkg_installed/x64-windows/bin;$env:PATH"
        cmake --build build-openssl --config Release --parallel 2
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ctest --test-dir build-openssl -C Release --output-on-failure --no-tests=error
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Test installed OpenSSL consumer
      shell: pwsh
      run: |
        $env:PATH = "$env:GITHUB_WORKSPACE/build-openssl/vcpkg_installed/x64-windows/bin;$env:PATH"
        cmake --install build-openssl --config Release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $arguments = @(
          "-S", "test_package", "-B", "build-openssl-consumer",
          "-G", "Visual Studio 17 2022", "-A", "x64",
          "-DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }}",
          "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/cbor-tags-openssl;$env:GITHUB_WORKSPACE/build-openssl/vcpkg_installed/x64-windows",
          "-DCBOR_TAGS_TEST_PACKAGE_REQUIRE_CWT_OPENSSL=ON"
        )
        if ("${{ matrix.compiler }}" -eq "ClangCL") {
          $arguments += @("-T", "ClangCL")
        }
        cmake @arguments
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build build-openssl-consumer --config Release --parallel 2
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & ./build-openssl-consumer/Release/test_package.exe
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
