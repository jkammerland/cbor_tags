name: Prepare Tagged Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to publish or audit
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Signed Release Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.verify.outputs.release_tag }}
      release_tag_object: ${{ steps.verify.outputs.release_tag_object }}
      release_commit: ${{ steps.verify.outputs.release_commit }}
      release_version: ${{ steps.verify.outputs.release_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch candidate tag from trusted workflow ref
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          expected_workflow_ref="refs/heads/${DEFAULT_BRANCH}"
          if [[ "${GITHUB_REF}" != "${expected_workflow_ref}" ]]; then
            echo "Release workflow must be dispatched from ${expected_workflow_ref}, got ${GITHUB_REF}" >&2
            exit 1
          fi
          if [[ "${RELEASE_TAG}" != v* ]] || ! git check-ref-format "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git fetch origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

      - name: Verify tag signature, ancestry, and versions
        id: verify
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          verification_output="$(
            bash scripts/release.sh verify-tag \
              --tag "${RELEASE_TAG}" \
              --trusted-ref "refs/remotes/origin/${DEFAULT_BRANCH}"
          )"
          printf '%s\n' "${verification_output}"
          while IFS='=' read -r key value; do
            case "${key}" in
              release_tag|release_tag_object|release_commit|release_version)
                printf '%s=%s\n' "${key}" "${value}" >> "${GITHUB_OUTPUT}"
                ;;
              *)
                echo "Unexpected verifier output key: ${key}" >&2
                exit 1
                ;;
            esac
          done <<< "${verification_output}"

      - name: Verify release commit checks
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.verify.outputs.release_commit }}
        run: |
          set -euo pipefail
          bash scripts/verify-release-commit-checks.sh \
            --commit "${RELEASE_COMMIT}" \
            --branch "${DEFAULT_BRANCH}"

  build:
    name: Build Reproducible Release Assets
    needs: verify
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
      RELEASE_TAG_OBJECT: ${{ needs.verify.outputs.release_tag_object }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify.outputs.release_commit }}

      - name: Setup CMake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: '4.4.0'

      - name: Install release build tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y curl diffutils gpg ninja-build python3-jsonschema tar unzip zip

      - name: Bootstrap vcpkg
        uses: ./.github/actions/bootstrap-vcpkg

      - name: Recheck tag and set reproducible timestamp
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git fetch origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          verification_output="$(
            bash scripts/release.sh verify-tag \
              --tag "${RELEASE_TAG}" \
              --trusted-ref "refs/remotes/origin/${DEFAULT_BRANCH}"
          )"
          grep -Fx "release_tag_object=${RELEASE_TAG_OBJECT}" <<< "${verification_output}"
          grep -Fx "release_commit=${RELEASE_COMMIT}" <<< "${verification_output}"
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct "${RELEASE_COMMIT}")" >> "${GITHUB_ENV}"

      - name: Build and validate unsigned source artifacts
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/release.sh build --package-dir build/release-packages

      - name: Upload reproducible unsigned artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cbor-tags-${{ needs.verify.outputs.release_tag }}-unsigned
          path: |
            build/release-packages/*.tar.gz
            build/release-packages/*.zip
            build/release-packages/*.sha256
            build/release-packages/*.sha512
            build/release-packages/*.spdx.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Sign and Verify Release Candidate
    needs: [verify, build]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.verify.outputs.release_tag }}
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_COMMIT: ${{ needs.verify.outputs.release_commit }}
      RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
      RELEASE_TAG_OBJECT: ${{ needs.verify.outputs.release_tag_object }}
      RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify.outputs.release_commit }}

      - name: Install signing and verification tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y diffutils gpg jq

      - name: Download unsigned build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cbor-tags-${{ needs.verify.outputs.release_tag }}-unsigned
          path: build/release-packages

      - name: Recheck signed tag after environment approval
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git fetch origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          verification_output="$(
            bash scripts/release.sh verify-tag \
              --tag "${RELEASE_TAG}" \
              --trusted-ref "refs/remotes/origin/${DEFAULT_BRANCH}"
          )"
          grep -Fx "release_tag_object=${RELEASE_TAG_OBJECT}" <<< "${verification_output}"
          grep -Fx "release_commit=${RELEASE_COMMIT}" <<< "${verification_output}"

      - name: Inspect release state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_state="$(
            bash scripts/publish-release.sh state \
              --tag "${RELEASE_TAG}" \
              --commit "${RELEASE_COMMIT}"
          )"
          printf 'release_state=%s\n' "${release_state}" >> "${GITHUB_OUTPUT}"
          printf 'Release state: %s\n' "${release_state}"

      - name: Audit existing immutable release
        if: steps.state.outputs.release_state == 'published'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/publish-release.sh audit \
            --tag "${RELEASE_TAG}" \
            --tag-object "${RELEASE_TAG_OBJECT}" \
            --commit "${RELEASE_COMMIT}" \
            --version "${RELEASE_VERSION}" \
            --download-dir build/published-release-audit \
            --expected-unsigned-dir build/release-packages

      - name: Import release signing key
        if: steps.state.outputs.release_state != 'published'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_SIGNING_KEY_SECRET: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          expected_fingerprint="7A9DA5E43CC1A9ECB9745CBE3A209DA2768BE08D"
          if [[ -z "${GPG_PRIVATE_KEY}" ]]; then
            echo "GPG_PRIVATE_KEY environment secret is required for releases" >&2
            exit 1
          fi

          mkdir -p "${HOME}/.gnupg"
          chmod 700 "${HOME}/.gnupg"
          printf '%s\n' "allow-loopback-pinentry" >> "${HOME}/.gnupg/gpg-agent.conf"
          gpgconf --kill gpg-agent || true
          printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import

          signing_selector="${GPG_SIGNING_KEY_SECRET:-${expected_fingerprint}}"
          signing_fingerprint="$(
            gpg --batch --with-colons --list-secret-keys "${signing_selector}" \
              | awk -F: '/^fpr:/ { print toupper($10); exit }'
          )"
          if [[ "${signing_fingerprint}" != "${expected_fingerprint}" ]]; then
            echo "Imported secret key fingerprint ${signing_fingerprint:-missing} does not match ${expected_fingerprint}" >&2
            exit 1
          fi
          printf 'GPG_SIGNING_KEY=%s\n' "${expected_fingerprint}" >> "${GITHUB_ENV}"

          if [[ -n "${GPG_PASSPHRASE}" ]]; then
            passphrase_file="${RUNNER_TEMP}/cbor-tags-gpg-passphrase"
            umask 077
            printf '%s' "${GPG_PASSPHRASE}" > "${passphrase_file}"
            printf 'GPG_PASSPHRASE_FILE=%s\n' "${passphrase_file}" >> "${GITHUB_ENV}"
          fi

      - name: Sign validated release payloads
        if: steps.state.outputs.release_state != 'published'
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/release.sh sign \
            --package-dir build/release-packages \
            --require-release-key
          bash scripts/release.sh verify-assets \
            --package-dir build/release-packages \
            --version "${RELEASE_VERSION}"

      - name: Upload signed workflow artifacts
        if: steps.state.outputs.release_state != 'published'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cbor-tags-${{ needs.verify.outputs.release_tag }}-signed
          path: |
            build/release-packages/*
          if-no-files-found: error
          retention-days: 30
